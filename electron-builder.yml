appId: com.clippahh.desktop
productName: Clippahh
asar: true
directories:
  output: dist
files:
  - desktop/main.cjs
  - package.json
extraResources:
  - from: desktop/packaged-app
    to: app
    filter:
      - "**/*"
  - from: desktop/postgres
    to: postgres
    filter:
      - "**/*"
  - from: desktop/clippahh-schema.sql
    to: clippahh-schema.sql
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: "${productName}-${version}-Portable.${ext}"
artifactName: "${productName}-${version}-Setup.${ext}"
